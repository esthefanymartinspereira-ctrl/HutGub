<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech</title>

    <style>
        header {
            background-color: #183c63;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            border: 5px solid #c22525;
        }

        main {
            background-color: #ffffff;
            color: #183c63;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px; /* Opcional: arredonda levemente os cantos da foto */
        }

        .artigo-autor {
            font-weight: bold;
            margin-top: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Blog Tech</h1>
        <p>Por esthefany martins Tápparo</p>
        <p>Vou compartilhar conhecimentos de tecnologia e programação</p>
    </header>

    <main>
        <article style="display: flex; gap: 16px; align-items: flex-start;">
            <img src="imagem5.png" alt="Ilustração conceitual de tecnologia na educação mostrando um estudante usando laptop cercado por ícones de conhecimento e inovação.">
           
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: esthefany martins Tápparo</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
            </div>
        </article>
    </main>
</body>
</html>
